epic_id: "EPIC-7"
epic_name: "Market Intelligence — Pesquisa de Mercado"
prd_file: "docs/prd/epic-7-market-intelligence.md"
version: "1.0"
created: "2026-04-01"
status: "ready_for_execution"

# Execução em 5 waves com paralelismo máximo

waves:
  - wave: 1
    name: "Foundation"
    description: "DB migration, tipos TypeScript e plugin catalog"
    can_parallelize: false
    stories:
      - id: "7.1"
        file: "docs/stories/story-7.1-market-intelligence-foundation.md"
        branch: "feat/7.1-market-intelligence-foundation"
        estimated_complexity: "medium"

  - wave: 2
    name: "Core Services"
    description: "Serviços backend + config admin backend — paralelos"
    can_parallelize: true
    depends_on_wave: 1
    stories:
      - id: "7.2"
        file: "docs/stories/story-7.2-instagram-scan-service.md"
        branch: "feat/7.2-instagram-scan-service"
        estimated_complexity: "high"
      - id: "7.3"
        file: "docs/stories/story-7.3-admin-config-backend.md"
        branch: "feat/7.3-admin-plugin-config-backend"
        estimated_complexity: "medium"

  - wave: 3
    name: "Pipeline + Admin UI"
    description: "Pipeline completo de pesquisa + painel admin frontend — paralelos"
    can_parallelize: true
    depends_on_wave: 2
    stories:
      - id: "7.4"
        file: "docs/stories/story-7.4-admin-config-frontend.md"
        branch: "feat/7.4-admin-plugin-config-frontend"
        estimated_complexity: "high"
        depends_on: ["7.3"]
      - id: "7.5"
        file: "docs/stories/story-7.5-market-research-pipeline.md"
        branch: "feat/7.5-market-research-pipeline"
        estimated_complexity: "very_high"
        depends_on: ["7.2", "7.3"]

  - wave: 4
    name: "API Routes + Instagram UI"
    description: "Rotas de market research + card de Instagram — paralelos"
    can_parallelize: true
    depends_on_wave: 3
    stories:
      - id: "7.6"
        file: "docs/stories/story-7.6-market-research-api-routes.md"
        branch: "feat/7.6-market-research-api"
        estimated_complexity: "medium"
        depends_on: ["7.5"]
      - id: "7.7"
        file: "docs/stories/story-7.7-instagram-card-ui.md"
        branch: "feat/7.7-instagram-card-ui"
        estimated_complexity: "medium"
        depends_on: ["7.2"]

  - wave: 5
    name: "Full Frontend + RAG"
    description: "Aba Pesquisa Profunda + integração RAG final — paralelos"
    can_parallelize: true
    depends_on_wave: 4
    stories:
      - id: "7.8"
        file: "docs/stories/story-7.8-pesquisa-profunda-tab.md"
        branch: "feat/7.8-pesquisa-profunda-tab"
        estimated_complexity: "high"
        depends_on: ["7.6", "7.7"]
      - id: "7.9"
        file: "docs/stories/story-7.9-rag-integration.md"
        branch: "feat/7.9-rag-integration"
        estimated_complexity: "low"
        depends_on: ["7.5", "7.8"]

